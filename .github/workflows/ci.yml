name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wb_ci
          POSTGRES_PASSWORD: wb_ci_throwaway
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://wb_ci:wb_ci_throwaway@127.0.0.1:5432/postgres
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: wb_ci
      S3_SECRET_ACCESS_KEY: wb_ci_throwaway
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Generated Solana client matches the IDL
        run: |
          pnpm --filter @worthybound/solana generate:client
          git diff --exit-code packages/solana/src/generated
      # Service containers cannot pass a command, so the storage server is started here.
      - name: Start object storage
        run: |
          docker run -d --name object-storage -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs object-storage
          exit 1
      - run: pnpm test

  program:
    name: Solana program build and tests
    runs-on: ubuntu-latest
    env:
      AGAVE_VERSION: v4.3.0
      WB_REQUIRE_PROGRAM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust (rust-toolchain.toml) and Agave
        run: |
          rustup show active-toolchain || rustup toolchain install
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: program-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo-build-sbf --manifest-path programs/worthybound/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worthybound/solana... build
      - run: pnpm --filter @worthybound/solana test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose --no-banner
