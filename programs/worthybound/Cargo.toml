[package]
name = "worthybound"
version = "0.1.0"
description = "WorthyBound asset registry: frozen Metaplex Core tokens, status and Trust Score"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "worthybound"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.32.1"
mpl-core = { version = "0.12.1", default-features = false, features = ["anchor", "anchor-0-32"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
